<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GYM">
<meta name="theme-color" content="#141821" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F1F3F6" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>GYM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: phone app. Header with group chips, content, fixed bottom tab bar. Dark gym palette, chalk-yellow accent. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface-2:#E9ECF1; --fg:#161A22; --muted:#646C7C;
  --line:#D8DDE6; --accent:#D59A14; --accent-soft:#F7E7B9; --accent-fg:#1A1400;
  --good:#1F9D5A; --bad:#C9414A; --shadow:0 1px 2px rgba(20,24,33,.06),0 6px 20px rgba(20,24,33,.06);
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --nav-h:58px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141821; --surface:#1C212C; --surface-2:#252B38; --fg:#EEF0F4; --muted:#98A0B0;
  --line:#2E3542; --accent:#F2C14E; --accent-soft:#3A3115; --accent-fg:#1A1400;
  --good:#5BC489; --bad:#E0646A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141821; --surface:#1C212C; --surface-2:#252B38; --fg:#EEF0F4; --muted:#98A0B0;
  --line:#2E3542; --accent:#F2C14E; --accent-soft:#3A3115; --accent-fg:#1A1400;
  --good:#5BC489; --bad:#E0646A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.short{display:none}
.gutter{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:10px 4px}
.brand{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.04em;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.today{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.today b{display:block;color:var(--fg);font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.02em}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left;line-height:1.1;position:relative}
.tab b{display:block;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.03em}
.tab span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tab[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tab .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--good)}
.tab.add{color:var(--muted);border-style:dashed;display:flex;align-items:center;font-weight:600}

main{padding-block:14px calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:14px;margin-bottom:12px}
.notice b{color:var(--fg)}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:2px 0 12px;flex-wrap:wrap}
.ghead h2{margin:0;font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.03em;text-wrap:balance}
.ghead h2 span{color:var(--muted);font-weight:500;font-size:18px;margin-left:8px}
.ghead .meta{font-size:12px;color:var(--muted)}

/* cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.card.filled{border-color:var(--accent)}
.card .head{display:flex;width:100%;align-items:flex-start;gap:10px;padding:12px 14px;text-align:left;min-height:52px}
.card .head .name{flex:1;min-width:0;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.02em;line-height:1.15;overflow-wrap:anywhere}
.card .head .last{font-size:11px;color:var(--muted);white-space:nowrap;padding-top:4px}
.card .head .last.today{color:var(--good);font-weight:600}
.sets{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:6px;padding:0 14px 12px}
.set{background:var(--surface-2);border-radius:10px;padding:8px 8px 7px;min-width:0}
.set .lbl,.set .cnt{white-space:nowrap}
.set .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.set .val{font-family:var(--display);font-weight:700;font-size:clamp(17px,5.6vw,24px);line-height:1.1;margin-top:2px;overflow-wrap:anywhere}
.set .val.empty{color:var(--muted);font-weight:500}
.set .cnt{font-size:11px;color:var(--muted);margin-top:2px}
.d{display:inline-block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;margin-right:3px;vertical-align:1px}
.d.up{border-bottom:6px solid var(--good)} .d.down{border-top:6px solid var(--bad)}

.detail{border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:14px}
.detail h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.detail h4 button{font-size:11px;color:var(--bad);font-weight:600;letter-spacing:0;text-transform:none;min-height:32px;padding:0 6px;margin:-6px -6px -6px 0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--surface-2);border-radius:6px;padding:2px 7px;font-size:13px;font-weight:500}
.chip.last{background:var(--accent);color:var(--accent-fg);font-weight:600}
.spark{display:block;width:100%;height:40px;margin-top:6px}
.sess{width:100%;border-collapse:collapse;font-size:14px}
.sess th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;text-align:left;padding:2px 4px}
.sess td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:middle}
.sess td.date{color:var(--muted);font-size:13px;white-space:nowrap}
.sess td.v{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.02em}
.sess tr:first-child td.v{color:var(--accent)}
.sess td.x{text-align:right;width:36px}
.sess td.x button{color:var(--muted);font-size:16px;min-width:36px;min-height:36px;border-radius:8px}
.sess td.x button:hover{color:var(--bad);background:var(--surface-2)}
.legacy summary{cursor:pointer;font-size:12px;color:var(--muted);padding:6px 0;list-style:none;display:flex;gap:6px;align-items:center}
.legacy summary::before{content:"▸";font-size:11px}
.legacy[open] summary::before{content:"▾"}
.legacy .hist{margin-top:8px}

.form{background:var(--surface-2);border-radius:12px;padding:12px}
.form h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.inputs{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:6px}
.inputs label{display:flex;flex-direction:column;gap:3px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);min-width:0}
.inputs input{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 4px;text-align:center;font-weight:600;min-height:44px}
.inputs input::placeholder{color:var(--muted);font-weight:500;opacity:.8}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row.actions .primary{grid-column:1/-1}
.btn{padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.rename{display:flex;gap:8px}
.rename input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px}
.confirm{background:var(--surface);border:1px solid var(--bad);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.addex{margin-top:4px;width:100%;padding:12px;min-height:48px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-weight:600}

/* workout mode */
.wdate{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;margin-bottom:12px}
.wdate label{font-size:13px;color:var(--muted)}
.wdate input{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:8px 10px;min-height:40px;color:var(--fg)}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px 12px}
.wcard.filled{border-color:var(--accent)}
.wcard .wh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.wcard .wh .name{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.02em;line-height:1.15;overflow-wrap:anywhere;min-width:0}
.wcard .wh .last{font-size:11px;color:var(--muted);white-space:nowrap}
.wcard .wh .last.today{color:var(--good);font-weight:600}
.wtools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.wtools .btn.sm{flex:1 1 auto}
.savebar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:6;padding:8px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;pointer-events:none;transform:translateY(120%);transition:transform .2s}
.savebar.show{transform:none}
.savebar .btn{pointer-events:auto;width:100%;max-width:688px;min-height:52px;font-size:16px;box-shadow:var(--shadow)}
.done{background:var(--surface);border:1px solid var(--good);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.done b{color:var(--good)}

/* table */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
table.grid{border-collapse:collapse;font-size:13px;min-width:100%}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.grid th{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.03em;background:var(--surface-2);position:sticky;top:0}
.grid td:first-child,.grid th:first-child{position:sticky;left:0;background:var(--surface);font-weight:600;min-width:120px;max-width:170px;overflow-wrap:anywhere;z-index:1}
.grid th:first-child{background:var(--surface-2);z-index:2}
.grid td.cell{min-width:220px;max-width:420px;line-height:1.5}
.grid td.cell .lastv{color:var(--accent);font-weight:700}
.grid tr:last-child td{border-bottom:0}
.tablenote{font-size:12px;color:var(--muted);margin:8px 2px 0}

/* journal */
.jstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.jstat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.jstat b{display:block;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1}
.jstat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.jday{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
.jday h3{margin:0 0 8px;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.jday h3 span{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
.jgroup{margin-top:8px}
.jgroup .gname{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600;margin-bottom:4px}
.jex{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid var(--line);font-size:14px}
.jex .n{min-width:0;overflow-wrap:anywhere;color:var(--muted)}
.jex .v{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.02em;white-space:nowrap}

/* notes */
.notes textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;line-height:1.5;resize:vertical}
.notes .hint{font-size:12px;color:var(--muted);margin:6px 2px}
.backup{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.backup h3{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.03em}
.backup p{color:var(--muted);font-size:13px;margin:0 0 10px}
.backup input[type=file]{display:none}
.backup .status{font-size:12px;color:var(--muted);margin-top:8px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:flex}
.nav button{flex:1;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.02em}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-pressed="true"]{color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:480px){
  .ghead{flex-direction:column;align-items:flex-start;gap:2px}
  .sets{gap:4px;padding-inline:10px}
  .set{padding:7px 5px 6px}
  .set .lbl{font-size:9px;letter-spacing:.04em}
  .set .cnt{font-size:10px}
  .inputs{gap:4px}
  .card .head{padding:11px 12px}
  .detail{padding-inline:12px}
  .grid td:first-child,.grid th:first-child{min-width:104px;max-width:130px;font-size:12px}
  .grid td.cell{min-width:180px;font-size:12px}
}
@media (max-width:360px){
  .full{display:none} .short{display:inline}
  .set .lbl{font-size:9px}
  .chip{font-size:12px;padding:2px 5px}
  .nav button{font-size:9.5px}
  .jstats{grid-template-columns:1fr 1fr}
}
@media (min-width:900px){
  main{max-width:960px}
  .list{display:grid;grid-template-columns:1fr 1fr;align-items:start}
  .card.open{grid-column:1/-1}
}
@media (hover:hover){ .card .head:hover .name{color:var(--accent)} .tab:hover{border-color:var(--accent)} }
@media (prefers-reduced-motion: reduce){ .toast,.savebar{transition:none} }
</style>

</head>
<body>
<header class="top gutter">
  <div class="bar">
    <div class="brand">GYM<small id="brand-sub">дневник весов</small></div>
    <div class="today" id="today-box"></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Группы мышц"></nav>
</header>
<main id="main" class="gutter"></main>
<div class="savebar" id="savebar"><button class="btn primary" id="savebtn">Сохранить тренировку</button></div>
<nav class="nav" id="nav" aria-label="Разделы">
  <button data-mode="workout"><svg viewBox="0 0 24 24"><path d="M3 10v4M6 8v8M18 8v8M21 10v4M6 12h12"/></svg>Тренировка</button>
  <button data-mode="cards"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/></svg>Карточки</button>
  <button data-mode="table"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 4v16"/></svg>Таблица</button>
  <button data-mode="journal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Журнал</button>
  <button data-mode="notes"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5z M15 3v4h4 M8 12h8M8 16h6"/></svg>Заметки</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = (s, r=document) => r.querySelector(s);
  const el = (tag, attrs={}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k,v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (k === 'html') n.innerHTML = v;
      else if (v !== false && v != null) n.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(k));
    return n;
  };
  const pref = (k, d) => { try { const v = localStorage.getItem('gym:'+k); return v == null ? d : JSON.parse(v); } catch { return d; } };
  const setPref = (k, v) => { try { localStorage.setItem('gym:'+k, JSON.stringify(v)); } catch {} };

  // ---------- state ----------
  const S = {
    dbState: 'loading', groups: pref('cache', []), notes: null, notesLoaded: false,
    active: pref('active', null), mode: pref('mode', 'workout'),
    open: null, form: null, confirm: null, rename: null, addingGroup: false, addingEx: false,
    wdate: null, draft: pref('draft', {}), justSaved: null,
  };

  // ---------- entries: string (old, no date) or {v, d} ----------
  const ev = e => (e && typeof e === 'object') ? String(e.v) : String(e);
  const ed = e => (e && typeof e === 'object' && e.d) ? e.d : null;
  const num = v => { const m = String(v).replace(',', '.').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; };
  const fmtNum = (x, comma) => { let s = (Math.round(x * 100) / 100).toString(); return comma ? s.replace('.', ',') : s; };
  const last = a => a.length ? a[a.length-1] : null;
  const today = () => { const d = new Date(); return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-'); };
  const MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  const DAYS = ['вс','пн','вт','ср','чт','пт','сб'];
  const parseD = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); };

        inputs.append(el('label', {}, el('span', { class: 'full' }, 'Подход ' + (i+1)), el('span', { class: 'short' }, 'П' + (i+1)), inp));
      }
      card.append(inputs);
      const lastVals = () => ins.map((inp, i) => { const l = last(ex.sets[i] || []); return l == null ? '' : ev(l); });
      const fill = arr => { arr.forEach((v, i) => { ins[i].value = v; setDraft(g.id, ex.id, i, v); }); };
      const bump = delta => { const cur = ins.map((inp, i) => inp.value || inp.placeholder); const comma = cur.some(v => v.includes(','));
        fill(cur.map((v, i) => { const x = num(v); return x == null || v === '—' ? (ins[i].value || '') : fmtNum(x + delta, comma); })); };
      card.append(el('div', { class: 'wtools' },
        el('button', { class: 'btn sm', onclick: () => fill(lastVals()) }, '↺ как в прошлый раз'),
        el('button', { class: 'btn sm num', onclick: () => bump(-2.5) }, '−2,5'),
        el('button', { class: 'btn sm num', onclick: () => bump(2.5) }, '+2,5'),
        vals.some(v => v && v.trim()) ? el('button', { class: 'btn sm ghost', onclick: () => fill(ins.map(() => '')) }, 'очистить') : null));
      list.append(card);
    }
    main.append(list, el('p', { class: 'tablenote' }, 'Заполни только то, что делал сегодня: серым показан прошлый вес. Введённое сохраняется как черновик, пока не нажмёшь «Сохранить тренировку».'));
  }

  function renderTable(g) {
    const n = g.nsets || 4;
    const wrap = el('div', { class: 'tablewrap' });
    const t = el('table', { class: 'grid num' });
    const thead = el('tr', {}, el('th', {}, g.name));
    for (let i = 1; i <= n; i++) thead.append(el('th', {}, String(i)));
    t.append(el('thead', {}, thead));
    const tb = el('tbody');
    for (const ex of g.exercises) {
      const tr = el('tr', {}, el('td', {}, ex.name));
      for (let i = 0; i < n; i++) {
        const arr = ex.sets[i] || [];
        const td = el('td', { class: 'cell' });
        arr.forEach((e, j) => { const v = ev(e); td.append(j < arr.length - 1 ? v + '-' : el('span', { class: 'lastv', title: ed(e) ? fmtDate(ed(e), true) : '' }, v)); });
        tr.append(td);
      }
      tb.append(tr);
    }
    t.append(tb); wrap.append(t);
    return [wrap, el('p', { class: 'tablenote' }, 'Та же таблица, что была в Заметках: столбцы — подходы, в ячейке — вся история весов через дефис. Жёлтым выделен последний вес.')];
  }

  function renderJournal(main) {
    const days = new Map(); // date -> Map(gid -> [{ex, vals}])
    for (const g of S.groups) for (const ex of g.exercises) {
      const by = new Map();
      ex.sets.forEach((s, i) => s.forEach(e => { const d = ed(e); if (!d) return; if (!by.has(d)) by.set(d, []); const r = by.get(d); r[i] = r[i] ? r[i] + '/' + ev(e) : ev(e); }));
      for (const [d, vals] of by) { if (!days.has(d)) days.set(d, new Map()); const gm = days.get(d); if (!gm.has(g.id)) gm.set(g.id, { g, items: [] }); gm.get(g.id).items.push({ ex, vals, n: g.nsets || 4 }); }
    }
    const dates = [...days.keys()].sort().reverse();
    const td = today(); const in30 = dates.filter(d => daysAgo(d) < 30).length; const in7 = dates.filter(d => daysAgo(d) < 7).length;
    main.append(el('div', { class: 'ghead' }, el('h2', {}, 'Журнал'), el('div', { class: 'meta' }, dates.length ? `${dates.length} тренировок с датой` : '')));
    main.append(el('div', { class: 'jstats num' },
      el('div', { class: 'jstat' }, el('b', {}, String(in7)), el('span', {}, 'за 7 дней')),
      el('div', { class: 'jstat' }, el('b', {}, String(in30)), el('span', {}, 'за 30 дней')),
      el('div', { class: 'jstat' }, el('b', {}, dates[0] ? rel(dates[0]) : '—'), el('span', {}, 'последняя'))));
    if (!dates.length) { main.append(el('div', { class: 'notice' }, el('b', {}, 'Пока нет тренировок с датой. '), 'Записи из Заметок перенесены без дат. Всё, что ты сохранишь через «Тренировка» или «Записать веса», появится здесь по дням.')); return; }
    for (const d of dates) {
      const box = el('div', { class: 'jday' }, el('h3', {}, fmtLong(d), el('span', {}, d === td ? 'сегодня' : rel(d))));
      for (const { g, items } of days.get(d).values()) {
        const grp = el('div', { class: 'jgroup' }, el('div', { class: 'gname' }, g.name + (g.ru ? ' · ' + g.ru : '')));
        for (const { ex, vals, n } of items) {
          const parts = []; for (let i = 0; i < n; i++) if (vals[i]) parts.push(vals[i]);
          grp.append(el('div', { class: 'jex' }, el('div', { class: 'n' }, ex.name), el('div', { class: 'v num' }, parts.join(' · '))));
        }
        box.append(grp);
      }
      main.append(box);
    }
  }

  function renderNotes(main) {
    const ta = el('textarea', { id: 'notes-ta', placeholder: 'Замеры, даты, план…' });
    ta.value = S.notes ?? '';
    main.append(el('div', { class: 'ghead' }, el('h2', {}, 'Заметки')),
      el('div', { class: 'notes' }, ta, el('p', { class: 'hint' }, S.notesLoaded ? 'Замеры, даты начала и конца циклов, что угодно.' : 'Загружаю…'),
        el('div', { class: 'row end' }, el('button', { class: 'btn primary', disabled: S.dbState !== 'ready', onclick: () => store.saveNotes(ta.value) }, 'Сохранить'))));
    if (store.renderBackup) store.renderBackup(main);
  }

  function render() {
    renderTabs();
    const main = $('#main'); main.replaceChildren();
    const g = activeGroup();
    $('#brand-sub').textContent = S.dbState === 'offline' ? 'только просмотр' : 'дневник весов';
    updateSavebar(g && S.mode === 'workout' ? g.id : null);
    if (S.mode !== 'workout') S.justSaved = null;

    if (S.dbState === 'offline') main.append(el('div', { class: 'notice' }, el('b', {}, 'Нет доступа к базе. '), 'Открой ссылку, войдя в свой аккаунт claude.ai, тогда записи можно будет добавлять. Сейчас показана последняя сохранённая копия.'));

    if (S.mode === 'notes') return renderNotes(main);
    if (S.mode === 'journal') return renderJournal(main);

    if (S.addingGroup) {
      const nm = el('input', { id: 'ng-name', type: 'text', placeholder: 'Название (напр. Press)' });
      const ru = el('input', { id: 'ng-ru', type: 'text', placeholder: 'Подпись (напр. Пресс)' });
      main.append(el('form', { class: 'form', style: 'margin-bottom:12px', onsubmit: e => { e.preventDefault(); addGroup(nm.value, ru.value); } },
        el('h4', {}, 'Новая группа мышц'), el('div', { class: 'rename' }, nm), el('div', { class: 'rename', style: 'margin-top:6px' }, ru),
        el('div', { class: 'row end', style: 'margin-top:10px' }, el('button', { type: 'button', class: 'btn ghost', onclick: () => { S.addingGroup = false; render(); } }, 'Отмена'), el('button', { type: 'submit', class: 'btn primary' }, 'Создать'))));
      setTimeout(() => nm.focus(), 0);
    }
    if (!g) {
      main.append(el('div', { class: 'notice' }, S.dbState === 'loading' ? 'Загружаю твои таблицы…' :
        [el('b', {}, 'Пока пусто. '), 'Нажми «+ Группа» сверху, чтобы добавить первую группу мышц, потом упражнения и веса.']));
      return;
    }
    const total = g.exercises.reduce((a, e) => a + e.sets.reduce((b, s) => b + s.length, 0), 0);
    main.append(el('div', { class: 'ghead' },
      el('h2', {}, g.name, g.ru ? el('span', {}, g.ru) : null),
      el('div', { class: 'meta num' }, `${g.exercises.length} упр. · ${total} записей`, g.lastEntry ? ' · последняя ' + rel(g.lastEntry) : '')));

    if (S.mode === 'workout') return renderWorkout(g, main);
    if (S.mode === 'table') { main.append(...renderTable(g)); return; }

    const list = el('div', { class: 'list' });
    for (const ex of g.exercises) list.append(renderCard(g, ex));
    main.append(list);
    if (S.dbState === 'ready') {
      if (S.addingEx) {
        const inp = el('input', { id: 'newex', type: 'text', placeholder: 'Название упражнения' });
        main.append(el('form', { class: 'form', style: 'margin-top:10px', onsubmit: e => { e.preventDefault(); addEx(g.id, inp.value); } },
          el('h4', {}, 'Новое упражнение'), el('div', { class: 'rename' }, inp, el('button', { type: 'submit', class: 'btn primary' }, 'Добавить'), el('button', { type: 'button', class: 'btn ghost', onclick: () => { S.addingEx = false; render(); } }, 'Отмена'))));
        setTimeout(() => inp.focus(), 0);
      } else main.append(el('button', { class: 'addex', onclick: () => { S.addingEx = true; render(); } }, '+ Упражнение'));
      if (S.confirm && S.confirm.type === 'group') {
        main.append(el('div', { class: 'confirm', style: 'margin-top:12px' }, `Удалить группу «${g.name}» со всеми упражнениями?`,
          el('button', { class: 'btn danger', onclick: () => removeGroup(g.id) }, 'Удалить'), el('button', { class: 'btn ghost', onclick: () => { S.confirm = null; render(); } }, 'Отмена')));
      } else if (!g.exercises.length) {
        main.append(el('div', { class: 'row end', style: 'margin-top:12px' }, el('button', { class: 'btn ghost danger', onclick: () => { S.confirm = { type: 'group' }; render(); } }, 'Удалить группу')));
      }
    }
  }

  for (const b of document.querySelectorAll('#nav button')) b.addEventListener('click', () => { setMode(b.dataset.mode); S.open = null; S.form = null; render(); window.scrollTo({ top: 0 }); });
  $('#savebtn').addEventListener('click', () => { const g = activeGroup(); if (g) saveWorkout(g.id); });
  setMode(S.mode);
  render();
  store.init();
})();
</script>
</body>
</html>
