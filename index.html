<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GYM">
<meta name="theme-color" content="#141821" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F1F3F6" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<script src="firebase-config.js"></script>
<title>GYM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: phone app. Header with group chips, content, fixed bottom tab bar. Dark gym palette, chalk-yellow accent. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface-2:#E9ECF1; --fg:#161A22; --muted:#646C7C;
  --line:#D8DDE6; --accent:#D59A14; --accent-soft:#F7E7B9; --accent-fg:#1A1400;
  --good:#1F9D5A; --bad:#C9414A; --shadow:0 1px 2px rgba(20,24,33,.06),0 6px 20px rgba(20,24,33,.06);
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --nav-h:58px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141821; --surface:#1C212C; --surface-2:#252B38; --fg:#EEF0F4; --muted:#98A0B0;
  --line:#2E3542; --accent:#F2C14E; --accent-soft:#3A3115; --accent-fg:#1A1400;
  --good:#5BC489; --bad:#E0646A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141821; --surface:#1C212C; --surface-2:#252B38; --fg:#EEF0F4; --muted:#98A0B0;
  --line:#2E3542; --accent:#F2C14E; --accent-soft:#3A3115; --accent-fg:#1A1400;
  --good:#5BC489; --bad:#E0646A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box;touch-action:manipulation}
html,body{touch-action:pan-x pan-y}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.short{display:none}
.gutter{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:10px 4px}
.brand{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.04em;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.today{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.today b{display:block;color:var(--fg);font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.02em}
.acct{min-width:40px;height:40px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:13px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex:0 0 auto}
.acct.on{background:var(--accent);color:var(--accent-fg);border-color:transparent;width:40px;padding:0;font-family:var(--display);font-size:18px}
.acct.warn{border-color:var(--accent);color:var(--accent)}
.auth{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.auth h3{margin:0;font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.02em}
.auth p{margin:0;color:var(--muted);font-size:14px}
.auth input{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:10px 12px;min-height:46px;width:100%}
.auth .err{color:var(--bad);font-size:13px}
.auth .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.auth .or::before,.auth .or::after{content:"";flex:1;border-top:1px solid var(--line)}
.choice{display:flex;flex-direction:column;gap:8px}
.choice button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px}
.choice button b{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.02em}
.choice button span{font-size:13px;color:var(--muted)}
.choice button.main{border-color:var(--accent);background:var(--accent-soft)}
.prof{display:flex;align-items:center;gap:12px}
.prof .av{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.prof .who{min-width:0;overflow-wrap:anywhere}
.prof .who b{display:block}
.prof .who span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left;line-height:1.1;position:relative}
.tab b{display:block;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.03em}
.tab span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tab[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tab .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--good)}
.tab.add{color:var(--muted);border-style:dashed;display:flex;align-items:center;font-weight:600}

main{padding-block:14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.sk{background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:10px}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.loader{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin:2px 0 14px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .sk{animation:none} .spin{animation-duration:2s} }
.notice{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:14px;margin-bottom:12px}
.notice b{color:var(--fg)}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:2px 0 12px;flex-wrap:wrap}
.ghead h2{margin:0;font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.03em;text-wrap:balance}
.ghead h2 span{color:var(--muted);font-weight:500;font-size:18px;margin-left:8px}
.ghead .meta{font-size:12px;color:var(--muted)}

/* cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.card.filled{border-color:var(--accent)}
.card .head{display:flex;width:100%;align-items:flex-start;gap:10px;padding:12px 14px;text-align:left;min-height:52px}
.card .head .name{flex:1;min-width:0;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.02em;line-height:1.15;overflow-wrap:anywhere}
.card .head .last{font-size:11px;color:var(--muted);white-space:nowrap;padding-top:4px}
.card .head .last.today{color:var(--good);font-weight:600}
.sets{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:6px;padding:0 14px 12px}
.set{background:var(--surface-2);border-radius:10px;padding:8px 8px 7px;min-width:0}
.set .lbl,.set .cnt{white-space:nowrap}
.set .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.set .val{font-family:var(--display);font-weight:700;font-size:clamp(17px,5.6vw,24px);line-height:1.1;margin-top:2px;overflow-wrap:anywhere}
.set .val.empty{color:var(--muted);font-weight:500}
.set .cnt{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set .cnt b{color:var(--fg);font-weight:600}
.d{display:inline-block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;margin-right:3px;vertical-align:1px}
.d.up{border-bottom:6px solid var(--good)} .d.down{border-top:6px solid var(--bad)}

.card .head .last .pr{display:block;color:var(--muted);font-weight:600;font-size:11px}
.card .head .last.today .pr{color:var(--muted)}
.set .val small{font-family:var(--body);font-weight:600;font-size:11px;color:var(--muted);margin-left:2px}
.sum{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.sum b{font-family:var(--display);font-size:18px;color:var(--fg);letter-spacing:.02em;margin-right:3px}
.sess tr.go{cursor:pointer}
.sess tr.go:active td{background:var(--surface-2)}
.sess tr.go:focus-visible{outline:2px solid var(--accent)}
.gear{margin-left:10px;font-size:18px;color:var(--muted);min-width:36px;min-height:36px;vertical-align:middle;border-radius:8px}
.gear:hover{color:var(--fg);background:var(--surface-2)}
.wcard{scroll-margin-top:calc(140px + env(safe-area-inset-top,0px))}
.tip{display:flex;flex-direction:column;gap:2px;background:var(--accent-soft);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px;color:var(--fg)}
.tip b{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.02em}
.tip span{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1}
.stat span{font-size:11px;color:var(--muted)}
.stat.up b{color:var(--good)} .stat.down b{color:var(--bad)}
.jex .v.good{color:var(--good)} .jex .v.bad{color:var(--bad)}
.detail{border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:14px}
.detail h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.detail h4 button{font-size:11px;color:var(--bad);font-weight:600;letter-spacing:0;text-transform:none;min-height:32px;padding:0 6px;margin:-6px -6px -6px 0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--surface-2);border-radius:6px;padding:2px 7px;font-size:13px;font-weight:500}
.chip.last{background:var(--accent);color:var(--accent-fg);font-weight:600}
.spark{display:block;width:100%;height:40px;margin-top:6px}
.sess{width:100%;border-collapse:collapse;font-size:14px}
.sess th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;text-align:left;padding:2px 4px}
.sess td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:middle}
.sess td.date{color:var(--muted);font-size:13px;white-space:nowrap}
.sess td.v{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.02em}
.sess tr:first-child td.v{color:var(--accent)}
.sess td.x{text-align:right;width:36px}
.sess td.x button{color:var(--muted);font-size:16px;min-width:36px;min-height:36px;border-radius:8px}
.sess td.x button:hover{color:var(--bad);background:var(--surface-2)}
.legacy summary{cursor:pointer;font-size:12px;color:var(--muted);padding:6px 0;list-style:none;display:flex;gap:6px;align-items:center}
.legacy summary::before{content:"▸";font-size:11px}
.legacy[open] summary::before{content:"▾"}
.legacy .hist{margin-top:8px}

.form{background:var(--surface-2);border-radius:12px;padding:12px}
.form h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.inputs{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:6px}
.inputs label{display:flex;flex-direction:column;gap:3px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);min-width:0}
.inputs input{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 4px;text-align:center;font-weight:600;min-height:44px}
.inputs input::placeholder{color:var(--muted);font-weight:500;opacity:.8}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row.actions .primary{grid-column:1/-1}
.btn{padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.rename{display:flex;gap:8px}
.rename input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px}
.confirm{background:var(--surface);border:1px solid var(--bad);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.addex{margin-top:4px;width:100%;padding:12px;min-height:48px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-weight:600}

/* workout mode */
.wdate{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;margin-bottom:12px}
.wdate label{font-size:13px;color:var(--muted)}
.wdate input{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:8px 10px;min-height:40px;color:var(--fg)}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px 12px}
.wcard.filled{border-color:var(--accent)}
.wcard .wh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.wcard .wh .name{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.02em;line-height:1.15;overflow-wrap:anywhere;min-width:0}
.wcard .wh .last{font-size:11px;color:var(--muted);white-space:nowrap}
.wcard .wh .last.today{color:var(--good);font-weight:600}
.srows{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:6px;min-height:46px}
.srow .sl{width:24px;flex:0 0 auto;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.srow .su{font-size:11px;color:var(--muted);flex:0 0 auto}
.stp{display:flex;align-items:center;flex:1 1 auto;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stp button{width:34px;min-height:44px;flex:0 0 auto;font-size:20px;font-weight:600;color:var(--muted)}
.stp button:active{background:var(--line)}
.stp input{flex:1 1 auto;min-width:0;width:100%;border:0;background:none;text-align:center;font-family:var(--display);font-weight:700;font-size:20px;min-height:44px;padding:0}
.stp input::placeholder{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.srow .sok{width:46px;min-height:44px;flex:0 0 auto;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-size:20px;font-weight:700}
.srow .sok:disabled{opacity:.4}
.srow .sdel{width:38px;min-height:44px;flex:0 0 auto;border-radius:10px;color:var(--bad);font-size:22px;background:var(--surface-2)}
.srow.done{background:var(--surface-2);border-radius:10px;padding:0 10px 0 8px;min-height:40px}
.srow.done .sv{flex:1;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.02em}
.srow.done .sv small{font-family:var(--body);font-weight:600;font-size:14px;color:var(--muted)}
.srow.done .sedit{font-size:12px;color:var(--muted);font-weight:600;min-height:40px;padding:0 4px}
.srow.editing{background:var(--accent-soft);border-radius:12px;padding:4px}
@media (max-width:360px){ .stp button{width:28px} .srow .sok{width:40px} .srow .su{display:none} }
.done{background:var(--surface);border:1px solid var(--good);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.done b{color:var(--good)}

/* table */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
table.grid{border-collapse:collapse;font-size:13px;min-width:100%}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.grid th{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.03em;background:var(--surface-2);position:sticky;top:0}
.grid td:first-child,.grid th:first-child{position:sticky;left:0;background:var(--surface);font-weight:600;min-width:120px;max-width:170px;overflow-wrap:anywhere;z-index:1}
.grid th:first-child{background:var(--surface-2);z-index:2}
.grid td.cell{min-width:220px;max-width:420px;line-height:1.5}
.grid td.cell .lastv{color:var(--accent);font-weight:700}
.grid tr:last-child td{border-bottom:0}
.tablenote{font-size:12px;color:var(--muted);margin:8px 2px 0}

/* journal */
.jstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.jstat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.jstat b{display:block;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1}
.jstat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.jday{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
.jday h3{margin:0 0 8px;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.jday h3 span{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
.jgroup{margin-top:8px}
.jgroup .gname{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600;margin-bottom:4px}
.jex{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid var(--line);font-size:14px}
.jex .n{min-width:0;overflow-wrap:anywhere;color:var(--muted)}
.jex .v{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.02em;white-space:nowrap}

/* notes */
.notes textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;line-height:1.5;resize:vertical}
.notes .hint{font-size:12px;color:var(--muted);margin:6px 2px}
.backup{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.backup h3{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.03em}
.backup p{color:var(--muted);font-size:13px;margin:0 0 10px}
.backup input[type=file]{display:none}
.backup .status{font-size:12px;color:var(--muted);margin-top:8px}

/* exercise library suggestions */

.daychip{flex:0 0 auto;min-height:48px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;line-height:1.15;display:flex;flex-direction:column;gap:1px;position:relative}

.daychip span{font-size:11px;color:var(--muted)}

.daychip.on{border-color:var(--accent);background:var(--accent-soft)}
.daychip.edit{justify-content:center;color:var(--muted);border-style:dashed;font-weight:600;font-size:14px}

@keyframes bump{30%{transform:scale(1.25) rotate(-6deg)}60%{transform:scale(.95)}}
.nav button svg.bump{animation:bump .45s cubic-bezier(.2,.8,.2,1)}
@keyframes expand{from{opacity:0;transform:translateY(-6px)}}
.detail{animation:expand .28s cubic-bezier(.2,.8,.2,1)}
.card,.wcard,.tab,.daychip{transition:transform .15s,border-color .2s,box-shadow .2s}
.card:active,.wcard:active{transform:scale(.995)}
.tab:active,.daychip:active,.coupon:active,.mitem:active,.gchip:active{transform:scale(.96)}
.btn{transition:transform .12s,background .2s,opacity .2s}

.stp button{transition:transform .12s,background .15s}

.tab[aria-pressed="true"]{animation:pop .25s cubic-bezier(.2,1.2,.4,1)}

@media (prefers-reduced-motion:reduce){ .enter,.detail,.nav button svg.bump,.spark .line,.tab[aria-pressed="true"],.srow.done.flash{animation:none} .spark .line{stroke-dashoffset:0} .card:active,.wcard:active,.btn:active:not(:disabled){transform:none} }
/* profile page */
.phead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}

.ptile span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

.acct.on{padding:0;overflow:hidden}
.menu{position:fixed;left:0;right:0;top:0;bottom:0;z-index:6;display:none;background:rgba(0,0,0,.35);padding:calc(env(safe-area-inset-top,0px) + 62px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.menu.show{display:block}
.mbox{margin-left:auto;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.4);padding:14px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 80px - env(safe-area-inset-top,0px));overflow:auto;animation:pop .25s cubic-bezier(.2,1.2,.4,1)}

.mrow{display:flex;flex-wrap:wrap;gap:8px}

.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mstats div{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.mstats b{display:block;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1}
.mstats span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.mgrow .jex{border-top:1px solid var(--line)}
.gbtn{background:#fff;color:#1f1f1f;border:1px solid #dadce0;font-weight:600}
.glogo{display:inline-flex;width:20px;height:20px} .glogo svg{width:20px;height:20px}

/* rest timer */
.timer{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px));z-index:8;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);transform:translateY(300%);visibility:hidden;transition:transform .25s,visibility 0s .25s;overflow:hidden}

.timer .tbar{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);opacity:.28;transition:width .25s linear}
.timer .tl{position:relative;font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
.timer b{position:relative;flex:1;font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.02em}
.timer button{position:relative;min-width:44px;min-height:40px;border-radius:10px;background:rgba(255,255,255,.14);color:inherit;font-weight:700;padding:0 10px}

.pr{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .3s}
.pr.show{opacity:1;pointer-events:auto}
.pr-box{position:relative;background:var(--surface);border:2px solid var(--accent);border-radius:20px;padding:22px 24px;text-align:center;max-width:320px;margin:0 20px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:6px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.pr-ic{font-size:44px;line-height:1}
.pr-box b{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.02em;line-height:1.15}
.pr-box span{color:var(--muted);font-size:14px}
.pr-conf{position:absolute;inset:0;overflow:hidden}
.pr-conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards;opacity:.95}

.heat i{aspect-ratio:1;border-radius:3px;background:var(--surface-2);display:block}

.streak{font-size:13px;color:var(--muted);margin-top:6px}

.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bgrid label{display:flex;flex-direction:column;gap:3px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:0}

.btable{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.btable th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:right;padding:4px 4px}

.btable td{padding:7px 4px;border-top:1px solid var(--line);text-align:right;font-family:var(--display);font-weight:600;font-size:16px}
.btable td:first-child{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.btable td .dl{color:var(--muted);font-size:14px;min-width:32px;min-height:32px}
.btable td.delta{font-family:var(--body);font-size:11px;font-weight:600}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:flex}
.nav button{flex:1;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.02em}

.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:480px){
  .ghead{flex-direction:column;align-items:flex-start;gap:2px}

let lastTap = 0; document.addEventListener('touchend', e => { const now = Date.now(); const tag = (e.target.tagName || '').toLowerCase();
